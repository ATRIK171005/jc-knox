<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e5e4e0" />
    <script>
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
    <!--
      General Sans (Fontshare) — closest free stand-in for Ataero Retina OB:
      geometric sans, tall x-height, generous counters, humanist terminals.
      Preconnect so the display type isn't the last thing to paint.
    -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,700&display=swap"
    />

    <title>JC Knox — Brand &amp; digital studio</title>
    <meta
      name="description"
      content="JC Knox is a founder-led brand and digital studio. Identity, websites and digital product for brands that refuse to blend in."
    />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JC Knox — Brand &amp; digital studio" />
    <meta
      property="og:description"
      content="Identity, websites and digital product, run by the person who does the work."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
